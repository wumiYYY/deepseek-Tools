# 鲸鱼娘金库 · 更新包静态托管片段（nginx）
#
# 用法：把 make-update-json.ps1 生成的目录同步到 /var/www/whale-vault/，
#       再把下面这段放进 server { } 里（或 sites-enabled 的对应 server 块）。
#
# 三条要点：
#   1) update.json 必须 no-store —— 否则客户端拿到旧 versionCode，永远"检查不到更新"
#   2) apk 给正确的 MIME（部分系统浏览器/下载器认这个）
#   3) autoindex off —— 别让历史包被列出来（素材授权：不能公开分发）

# ---- 对外只暴露这一个文件时，用它控制缓存 ----
location = /whale-vault/update.json {
    root /var/www;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    # 可选：只允许 App 的 User-Agent 拉（挡掉随手翻的人，不是安全边界）
    # if ($http_user_agent !~* "WhaleMoney|Android|okhttp") { return 403; }
}

# ---- 安装包与校验文件 ----
location /whale-vault/ {
    root /var/www;
    types {
        application/vnd.android.package-archive apk;
        text/plain txt;
        application/json json;
    }
    default_type application/octet-stream;

    autoindex off;                 # 关键：不列目录
    add_header Cache-Control "no-cache";   # 文件名带版本号，缓存无妨，这里求稳

    # 可选：Basic Auth（最简单的一层门）
    # auth_basic "whale-vault";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}

# ============================================================
# 如果你用对象存储（OSS / COS / S3）：
#   - 元数据里给 update.json 单独设 Cache-Control: no-store
#   - 其余文件可以 public-read + 长缓存
#   - 桶策略务必关掉「公共读列表」，只允许按 URL 直取
#   - 强烈建议走「私有桶 + 签名 URL / CDN 鉴权」，别裸奔
# ============================================================
