name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单元测试（120 个）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ⚠️ 必须是 v4：v3 会去下载 Google 已经下架的旧 cmdline-tools 包，
      # 直接 404 秒挂（v4.0.2 的更新说明就是 "Fix for removed tools package"）。
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 SDK 平台与构建工具
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      # 同理：gradle/actions 已经到 v6，v3 是两年前的东西。
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 先把环境打出来：下次再挂，日志里直接能看出是 SDK / JDK / 依赖哪一层的问题，
      # 不用靠"猜 + 截图问我"。
      - name: 环境自检
        run: |
          chmod +x gradlew
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ./gradlew --version

      - name: 跑单元测试
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      # 抓取规则的遍历测试（CaptureAllRulesTest / CaptureRuleMatrixTest）是防止
      # 「改规则把人改回原样」的唯一闸门，所以测试报告一定要能下载来看。
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  rules-check:
    name: 规则文件校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检查 capture_rules.json 是合法 JSON 且关键表不为空
        run: |
          python3 - <<'PY'
          import json, sys
          path = "app/src/main/assets/capture_rules.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          required = ["adMarkers","nonTxnMarkers","fundTransferMarkers","strongPayTemplate",
                      "txnEvidence","payEvidence","paySourceMarkers","transferMarkers",
                      "bankTextMarkers","strongHints","marketingChannels","payRailPackages",
                      "commercePackages","contentPackages","junk","specUnits","incomeWords","expenseWords"]
          problems = []
          for key in required:
              if key not in data:
                  problems.append(f"缺少字段 {key}")
                  continue
              vals = data[key]
              if not isinstance(vals, list) or not vals:
                  problems.append(f"{key} 不是非空数组")
                  continue
              if any((not isinstance(v, str)) or v.strip() == "" for v in vals):
                  problems.append(f"{key} 里有空词条")
          total = sum(len(data[k]) for k in required if isinstance(data.get(k), list))
          print(f"规则条目合计：{total}")
          if total < 400:
              problems.append(f"规则总量异常偏少：{total}")
          if problems:
              print("规则文件有问题：")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("规则文件校验通过 ✅")
          PY
